<!doctype html>
<!-- Page around one own widget in the XENEON EDGE kiosk
     Author: wwoutt (2026-11-11), written by Claude (Anthropic)
     License: GPL-3.0 or later

     Shows widget.html in a sandboxed iframe (opaque origin, no network, no
     storage) and passes it its data, like the kiosk page of the fork
     wwoutt/OpenLinkHub (static/js/xeneon-layout.js). Only this page knows
     the token for the widget server. -->
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: https:; font-src data:; connect-src 'self'; frame-src about:">
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
    .error { padding: 12px; color: #a1a1a1; font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<iframe id="frame" sandbox="allow-scripts" title="widget"></iframe>
<script>
    const CONFIG = {{CONFIG}};
    const API = '/api/widgets/' + encodeURIComponent(CONFIG.id);
    const HEADERS = {'X-Quartercore-Token': CONFIG.token};
    const frame = document.getElementById('frame');
    let lastData = null;

    function helperGet(path) {
        return fetch(API + path, {headers: HEADERS}).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        });
    }

    // The widget document: same CSP, colours and API as in the fork's kiosk
    function widgetDocument(html) {
        return '<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark">' +
            '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; ' +
            'style-src \'unsafe-inline\'; img-src data: https:; font-src data:">' +
            '<style>:root{--olh-text:#e6e6e6;--olh-muted:#a1a1a1;--olh-accent:#38bdf8;}' +
            'html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:var(--olh-text);' +
            'font-family:system-ui,sans-serif;}</style>' +
            '<script>window.addEventListener("message",function(e){var d=e.data;' +
            'if(e.source!==parent||!d||d.type!=="olh-data"||typeof window.onData!=="function")return;' +
            'try{window.onData(d.data,{ok:d.ok,error:d.error,updated:d.updated});}catch(err){console.error(err);}});' +
            'document.addEventListener("DOMContentLoaded",function(){parent.postMessage({type:"olh-ready"},"*");});' +
            // olhAction(data) sends a request to the widget's action script, returns a Promise
            'var olhPending={},olhNext=1;window.olhAction=function(data){return new Promise(function(resolve){' +
            'var id=olhNext++;olhPending[id]=resolve;parent.postMessage({type:"olh-action",id:id,data:data},"*");});};' +
            'window.addEventListener("message",function(e){var d=e.data;' +
            'if(e.source!==parent||!d||d.type!=="olh-action-result"||!olhPending[d.id])return;' +
            'olhPending[d.id]({ok:d.ok,error:d.error,data:d.data});delete olhPending[d.id];});' +
            '<\/script></head><body>' + html + '</body></html>';
    }

    function sendData() {
        if (frame.contentWindow && lastData) {
            frame.contentWindow.postMessage(Object.assign({type: 'olh-data'}, lastData), '*');
        }
    }

    function refresh() {
        helperGet('/data').then(function (data) {
            lastData = data;
        }).catch(function (e) {
            lastData = {ok: false, data: null, error: 'Quartercore: ' + e.message, updated: 0};
        }).then(sendData);
    }

    window.addEventListener('message', function (e) {
        if (e.source !== frame.contentWindow || !e.data) return;
        if (e.data.type === 'olh-ready') {
            sendData();
            return;
        }
        if (e.data.type !== 'olh-action') return;
        const id = e.data.id;
        const reply = function (result) {
            frame.contentWindow.postMessage(Object.assign({type: 'olh-action-result', id: id}, result), '*');
        };
        if (!CONFIG.action) {
            reply({ok: false, error: 'widget has no action script', data: null});
            return;
        }
        fetch(API + '/action', {
            method: 'POST',
            headers: Object.assign({'Content-Type': 'application/json'}, HEADERS),
            body: JSON.stringify({data: e.data.data === undefined ? null : e.data.data})
        }).then(function (r) {
            return r.json();
        }).catch(function () {
            return {ok: false, error: 'Quartercore not reachable', data: null};
        }).then(function (result) {
            reply({ok: !!result.ok, error: result.error || null, data: result.data === undefined ? null : result.data});
            // Give the device a moment to report its new state
            setTimeout(refresh, 700);
        });
    });

    helperGet('/html').then(function (response) {
        frame.srcdoc = widgetDocument(response.html);
        refresh();
        setInterval(refresh, Math.max(1, CONFIG.refresh || 60) * 1000);
    }).catch(function (e) {
        document.body.innerHTML = '';
        const error = document.createElement('p');
        error.className = 'error';
        error.textContent = 'Quartercore: ' + e.message;
        document.body.appendChild(error);
    });
</script>
</body>
</html>
